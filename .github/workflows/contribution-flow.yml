name: Contribution Flow

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate-contributions.mjs
      - .github/workflows/contribution-flow.yml

permissions:
  contents: write

concurrency:
  group: contribution-flow
  cancel-in-progress: false

jobs:
  calendar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout profile
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate calendar from dates and counts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_PROFILE: ${{ github.repository_owner }}
        run: node scripts/generate-contributions.mjs
      - name: Publish calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/contribution-flow.svg
          if git diff --cached --quiet; then
            echo 'Calendar unchanged.'
            exit 0
          fi
          git commit -m 'Update contribution calendar'
          git pull --rebase origin main
          git push origin HEAD:main
